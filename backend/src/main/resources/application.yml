server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  forward-headers-strategy: none
  servlet:
    session:
      cookie:
        name: ELIB_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  application:
    name: elib
  session:
    store-type: redis
    redis:
      namespace: elib:session
    timeout: 30m
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            scope:
              - openid
              - profile
              - email
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:55432}/${POSTGRES_DB:elib}
    username: ${POSTGRES_USER:elib}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      validation-timeout: 1000
      data-source-properties:
        connectTimeout: 3
        socketTimeout: 3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: elib
        jdbc.time_zone: UTC
  flyway:
    default-schema: elib
    schemas: elib
    create-schemas: true
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:56379}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

elib:
  auth:
    allowed-domains: ${ALLOWED_DOMAINS:}
    frontend-url: ${FRONTEND_URL:http://127.0.0.1:5173}
management:
  endpoints:
    web:
      base-path: /api/system
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
logging:
  pattern:
    level: '%5p [requestId=%X{requestId:-}]'
